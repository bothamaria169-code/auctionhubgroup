<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PVA Vehicle Sales Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #C9A84C;
    --gold-light: #E8C96A;
    --gold-dim: rgba(201,168,76,0.15);
    --charcoal: #111213;
    --surface: #1A1C1E;
    --surface2: #232527;
    --surface3: #2D3033;
    --border: rgba(255,255,255,0.07);
    --text: #F0EDE8;
    --text-muted: #8A8680;
    --red: #E05252;
    --green: #4CAF7D;
  }

  body {
    background: var(--charcoal);
    font-family: 'DM Sans', sans-serif;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(201,168,76,0.08) 0%, transparent 60%),
      repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(255,255,255,0.018) 39px, rgba(255,255,255,0.018) 40px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(255,255,255,0.018) 39px, rgba(255,255,255,0.018) 40px);
  }

  .widget-shell {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    height: 90vh;
    max-height: 780px;
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid rgba(201,168,76,0.25);
    box-shadow: 0 0 0 1px rgba(0,0,0,0.5), 0 32px 80px rgba(0,0,0,0.7), 0 0 60px rgba(201,168,76,0.05);
    animation: shellIn 0.6s cubic-bezier(0.16,1,0.3,1) both;
  }

  @keyframes shellIn {
    from { opacity: 0; transform: translateY(24px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* HEADER */
  .header {
    background: var(--surface);
    padding: 18px 20px;
    border-bottom: 1px solid rgba(201,168,76,0.2);
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
    position: relative;
  }
  .header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: 0.4;
  }

  .logo-mark {
    width: 42px; height: 42px;
    background: linear-gradient(135deg, var(--gold) 0%, #8A6A20 100%);
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    color: var(--charcoal);
    letter-spacing: 0.5px;
    flex-shrink: 0;
  }

  .header-text { flex: 1; }
  .header-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 17px;
    letter-spacing: 1.5px;
    color: var(--gold-light);
    line-height: 1;
  }
  .header-sub {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 3px;
    letter-spacing: 0.3px;
  }

  .status-dot {
    width: 8px; height: 8px;
    background: var(--green);
    border-radius: 50%;
    box-shadow: 0 0 6px var(--green);
    animation: pulse 2s ease-in-out infinite;
    flex-shrink: 0;
  }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 6px var(--green); }
    50%      { box-shadow: 0 0 14px var(--green); }
  }

  /* TRUST BAR */
  .trust-bar {
    background: var(--gold-dim);
    border-bottom: 1px solid rgba(201,168,76,0.12);
    padding: 8px 20px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .trust-bar span {
    font-size: 10.5px;
    color: var(--gold);
    letter-spacing: 0.4px;
    font-weight: 500;
  }
  .trust-bar .pipe { color: rgba(201,168,76,0.3); }

  /* MESSAGES */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    background: var(--charcoal);
    scroll-behavior: smooth;
  }
  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 2px; }

  .msg {
    display: flex;
    gap: 10px;
    animation: msgIn 0.35s cubic-bezier(0.16,1,0.3,1) both;
    max-width: 92%;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.agent { align-self: flex-start; }

  .avatar {
    width: 30px; height: 30px;
    border-radius: 3px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 12px;
    margin-top: 2px;
  }
  .msg.agent .avatar {
    background: linear-gradient(135deg, var(--gold) 0%, #7A5E1A 100%);
    color: var(--charcoal);
  }
  .msg.user .avatar {
    background: var(--surface3);
    color: var(--text-muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 600;
  }

  .bubble {
    padding: 11px 14px;
    border-radius: 3px;
    font-size: 13.5px;
    line-height: 1.6;
    position: relative;
  }
  .msg.agent .bubble {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    border-left: 2px solid var(--gold);
  }
  .msg.user .bubble {
    background: linear-gradient(135deg, #2A2208, #1E1A0C);
    border: 1px solid rgba(201,168,76,0.25);
    color: var(--gold-light);
  }

  .bubble strong { color: var(--gold-light); font-weight: 600; }
  .bubble em { color: var(--text-muted); font-style: normal; font-size: 12px; }

  /* Call-to-action highlight inside bubble */
  .call-highlight {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--gold-dim);
    border: 1px solid rgba(201,168,76,0.3);
    border-radius: 2px;
    padding: 6px 10px;
    margin-top: 8px;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--gold);
    letter-spacing: 0.5px;
  }

  /* TYPING INDICATOR */
  .typing-indicator {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 12px 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-left: 2px solid var(--gold);
    border-radius: 3px;
    width: fit-content;
  }
  .typing-dot {
    width: 5px; height: 5px;
    background: var(--gold);
    border-radius: 50%;
    animation: typingBounce 1.2s ease-in-out infinite;
    opacity: 0.6;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typingBounce {
    0%,60%,100% { transform: translateY(0); }
    30%          { transform: translateY(-5px); opacity: 1; }
  }

  /* INPUT AREA */
  .input-area {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 14px 16px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-shrink: 0;
  }

  .input-wrap { flex: 1; position: relative; }

  textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13.5px;
    padding: 11px 14px;
    resize: none;
    outline: none;
    min-height: 44px;
    max-height: 120px;
    line-height: 1.5;
    transition: border-color 0.2s;
  }
  textarea:focus { border-color: rgba(201,168,76,0.4); }
  textarea::placeholder { color: var(--text-muted); }

  .send-btn {
    width: 44px; height: 44px;
    background: linear-gradient(135deg, var(--gold) 0%, #8A6A20 100%);
    border: none;
    border-radius: 3px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.2s, transform 0.15s;
    flex-shrink: 0;
  }
  .send-btn:hover { opacity: 0.85; transform: translateY(-1px); }
  .send-btn:active { transform: translateY(0); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .send-btn svg { fill: var(--charcoal); }

  /* FOOTER */
  .footer {
    background: var(--surface);
    padding: 8px 16px;
    text-align: center;
    font-size: 10px;
    color: var(--text-muted);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    letter-spacing: 0.3px;
  }
  .footer a { color: var(--gold); text-decoration: none; }

  /* QUICK REPLIES */
  .quick-replies {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 0 16px 12px;
    background: var(--charcoal);
    flex-shrink: 0;
  }
  .qr-btn {
    background: var(--surface2);
    border: 1px solid rgba(201,168,76,0.2);
    color: var(--gold);
    font-family: 'DM Sans', sans-serif;
    font-size: 11.5px;
    padding: 6px 12px;
    border-radius: 2px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
    font-weight: 500;
  }
  .qr-btn:hover { background: var(--gold-dim); border-color: rgba(201,168,76,0.4); }
</style>
</head>
<body>

<div class="widget-shell">
  <!-- HEADER -->
  <div class="header">
    <div class="logo-mark">PVA</div>
    <div class="header-text">
      <div class="header-name">AUCTION HUB GROUP</div>
      <div class="header-sub">Vehicle Sales Agent &bull; Pre-Auction Specialist</div>
    </div>
    <div class="status-dot"></div>
  </div>

  <!-- TRUST BAR -->
  <div class="trust-bar">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#C9A84C" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    <span>Est. 2016 · 10 Years</span>
    <span class="pipe">|</span>
    <span>Best Auctioneer 2018 &amp; 2019</span>
    <span class="pipe">|</span>
    <span>SAIA · NAA · JCCI · IEASA</span>
    <span class="pipe">|</span>
    <span>DEKRA Inspected</span>
  </div>

  <!-- MESSAGES -->
  <div class="messages" id="messages"></div>

  <!-- QUICK REPLIES -->
  <div class="quick-replies" id="quickReplies">
    <button class="qr-btn" onclick="sendQuick('Tell me about Pre-Auction Purchase')">🚗 Pre-Auction Purchase</button>
    <button class="qr-btn" onclick="sendQuick('How does the test drive and refund work?')">✅ Test drive & refund</button>
    <button class="qr-btn" onclick="sendQuick('I have bad credit, can I still buy?')">💰 Finance options</button>
    <button class="qr-btn" onclick="sendQuick('Is Auction Hub Group legitimate?')">🔒 Verify legitimacy</button>
  </div>

  <!-- INPUT -->
  <div class="input-area">
    <div class="input-wrap">
      <textarea id="msgInput" placeholder="Ask about a vehicle or pre-auction offers…" rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    </div>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2L15 22 11 13 2 9l20-7z"/></svg>
    </button>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <a href="https://auctionhubgroup.co.za" target="_blank">auctionhubgroup.co.za</a>
    &nbsp;&bull;&nbsp; +27 11 789 4375 &nbsp;&bull;&nbsp; Powered by AI
  </div>
</div>

<script>
const SYSTEM_PROMPT = `You are a knowledgeable, persuasive vehicle sales agent for Auction Hub Group (auctionhubgroup.co.za), South Africa's premier multi-asset auction house, founded in 2016. You have been given the official Auction Hub Group brochure, and you operate with complete accuracy based on its contents. Your primary duty is to drive Pre-Auction Purchases aggressively but ethically, while also being able to explain Auction Bidding and In-House Finance when asked. You are the ultimate trusted advisor.

## YOUR KNOWLEDGE BASE (FROM THE OFFICIAL BROCHURE)

**Company Trust Signals:**
- 10 years of auctioneering excellence (established 2016).
- Awarded Best Auctioneer 2018 & 2019 by Standard Bank.
- Memberships: SAIA, NAA, JCCI, IEASA.
- Level 2 BBBEE certificate.
- DEKRA-inspected vehicles.

**Pre-Auction Purchase – The Flagship Offering (PUSH THIS FIRST):**
- Pay the bank's outstanding balance, not market value. No retail markup. No auction premium.
- Free delivery anywhere.
- 1.5-hour test drive & full inspection – bring your own mechanic.
- 100% refund of reservation fee if not satisfied after test drive.
- No buyer's commission. No hidden fees.
- Secure the vehicle 7–14 days before auction day – skip the bidding war.

**Pre-Auction Process:**
1. Submit details: Name, ID/Passport, Email, Physical address, Mobile.
2. Receive Offer to Purchase & pay commitment fee (30-50% of asking price). Instantly get a 6-digit OTP Buyers Code via SMS.
3. Test drive (1.5 hours), inspect, pay the balance. If unsatisfied, full refund.

**Important Entry Rules:**
- No Buyers Code = No Entry.
- No Appointment = No Entry.
- No Walk-Ins Permitted.
- Must not lose or delete Buyers Code.

**Auction Bidding (Secondary Option):**
- Bid online or in-person.
- Registration deposit R10,000 (refundable per vehicle).
- FICA documents required.
- Sold as-is; no cancellations, no refunds after hammer fall.
- 21 days to register vehicle in buyer's name.
- Storage charges if not collected timeously.

**In-House Finance (Supporting Option):**
- NO credit checks. NO ITC. NO bureau inquiries.
- Blacklisted, low credit score, under debt review, first-time buyers all welcome.
- R10,500 deposit. Flexible terms: 6, 12, 24, 36, 48 months.
- Example: Vehicle R60,000, deposit R10,500, financed R49,500 over 12 months @ 3.0% p/m = R4,973/month.

**Fraud Warning & Verification:**
- Auction Hub Group will ONLY sell by way of public auction. No off-platform deals.
- Official contact: +27 11 789 4375. Customers are urged to call if uncertain before making any payments.

## YOUR PRE-AUCTION PUSH STRATEGY
Always lead with the Pre-Auction Purchase — it's the most advantageous path for the buyer. Frame it as the "smart shortcut" to a bank-priced vehicle with total safety.

## TONE & PERSONALITY
- Warm, confident, knowledgeable. A seasoned professional who genuinely wants the client to win.
- South African: "Howzit", "Sharp", "Yebo", "bakkie", "no nonsense".
- Trust-building through radical transparency: proactively raise the fraud warning and verification number.
- Keep responses concise and punchy — chat widget, not an essay. Use line breaks for readability.
- Use emojis sparingly but effectively (🚗 💰 📞 ✅ 🔎).

## CONVERSATION FLOW

### 1. INITIAL ENGAGEMENT
Greet warmly, establish legitimacy, pivot to pre-auction value. Mention: 10 years since 2016, Standard Bank award, verification number +27 11 789 4375, DEKRA-inspected, bank-balance pricing, free delivery, 1.5-hour test drive, 100% refund.

### 2. QUALIFYING
Ask one question at a time: vehicle type, budget, timeline.

### 3. PRESENTING A VEHICLE
Use: Year/Make/Model, mileage, DEKRA condition, pre-auction price (bank's outstanding balance), link to auctionhubgroup.co.za catalogue. Highlight: no commission, no hidden fees, free delivery, refund guarantee, 7-14 days before auction.

### 4. HANDLING OBJECTIONS
- "Is this legit?" → Call +27 11 789 4375 immediately. Mention SAIA, NAA, JCCI, IEASA, Level 2 BBBEE.
- "Can I get a refund?" → Yes, 100% after test drive, no questions.
- "What price do I pay?" → The bank's outstanding balance, shown upfront, no haggling.
- "Bad credit?" → In-house finance, NO credit checks, R10,500 deposit, everyone welcome. But pre-auction is still the best deal.
- "I'll just bid at auction." → Remind: auction is sold as-is, no refunds after hammer, bidding war risk. Pre-auction gives guaranteed price and refund safety net.

### 5. CLOSING — CAPTURE THESE DETAILS EXACTLY:
1. Full name & surname
2. ID or Passport number
3. Email address
4. Physical address
5. Mobile number
Then: Offer to Purchase generated → commitment fee (30-50%) → 6-digit Buyers Code via SMS → test drive → pay balance or get full refund.

### 6. FRAUD WARNING
Reiterate whenever trust wavers: "PVA will ONLY sell via public auction. No off-platform deals. Call +27 11 789 4375 if uncertain before any payment."

## CRITICAL RULES
- Always push Pre-Auction Purchase first.
- Official verification number: +27 11 789 4375 — no other number.
- Pre-auction price = bank's outstanding balance, not negotiable.
- Never say "pre-sale" — always "Pre-Auction Purchase".
- Never ask for payments directly; direct to official Offer to Purchase process.
- All links to auctionhubgroup.co.za only.

## ULTIMATE GOAL
Every conversation ends with the lead:
1. Providing details for a Pre-Auction Purchase Offer to Purchase,
2. Calling +27 11 789 4375 to verify and then proceeding, or
3. Leaving contact information for same-day human follow-up.`;

let history = [];
let isLoading = false;

function formatBubble(text) {
  // Bold **text**
  text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  // Phone number highlight
  text = text.replace(/\+27 11 789 4375/g, '<span class="call-highlight">📞 +27 11 789 4375</span>');
  text = text.replace(/011 789 4375/g, '<span class="call-highlight">📞 011 789 4375</span>');
  // Italics *text*
  text = text.replace(/\*(.*?)\*/g, '<em>$1</em>');
  // Line breaks
  text = text.replace(/\n/g, '<br>');
  return text;
}

function appendMsg(role, text, animate = true) {
  const container = document.getElementById('messages');
  const wrapper = document.createElement('div');
  wrapper.className = `msg ${role}`;
  if (!animate) wrapper.style.animation = 'none';

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'agent' ? 'PVA' : 'YOU';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = formatBubble(text);

  wrapper.appendChild(avatar);
  wrapper.appendChild(bubble);
  container.appendChild(wrapper);
  container.scrollTop = container.scrollHeight;
  return wrapper;
}

function showTyping() {
  const container = document.getElementById('messages');
  const wrapper = document.createElement('div');
  wrapper.className = 'msg agent';
  wrapper.id = 'typing';

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = 'PVA';

  const indicator = document.createElement('div');
  indicator.className = 'typing-indicator';
  for (let i = 0; i < 3; i++) {
    const dot = document.createElement('div');
    dot.className = 'typing-dot';
    indicator.appendChild(dot);
  }

  wrapper.appendChild(avatar);
  wrapper.appendChild(indicator);
  container.appendChild(wrapper);
  container.scrollTop = container.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typing');
  if (el) el.remove();
}

async function callClaude(userText) {
  history.push({ role: 'user', content: userText });

  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1000,
      system: SYSTEM_PROMPT,
      messages: history
    })
  });

  const data = await response.json();
  const reply = data.content?.[0]?.text || "Sharp — something went sideways on my end. Call the yard directly at 011 234 5678 and they'll sort you out immediately.";
  history.push({ role: 'assistant', content: reply });
  return reply;
}

async function sendMessage(text) {
  const input = document.getElementById('msgInput');
  const userText = (text || input.value).trim();
  if (!userText || isLoading) return;

  input.value = '';
  autoResize(input);
  document.getElementById('quickReplies').style.display = 'none';
  isLoading = true;
  document.getElementById('sendBtn').disabled = true;

  appendMsg('user', userText);
  showTyping();

  try {
    const reply = await callClaude(userText);
    removeTyping();
    appendMsg('agent', reply);
  } catch (err) {
    removeTyping();
    appendMsg('agent', "Network hiccup — no stress. Call us directly at 011 234 5678 and our team will assist you straight away. 🤙");
  }

  isLoading = false;
  document.getElementById('sendBtn').disabled = false;
  input.focus();
}

function sendQuick(text) {
  sendMessage(text);
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// Opening message
window.addEventListener('load', () => {
  setTimeout(() => {
    appendMsg('agent', "👋 Howzit! Welcome to **Auction Hub Group** — trusted auctioneers since 2016, awarded **Best Auctioneer by Standard Bank** in 2018 & 2019.\n\nBefore we talk vehicles, know this: we only sell via public auction, and you can always verify us on +27 11 789 4375.\n\nBut here's the real gem — our **Pre-Auction Purchase** lets you skip the bidding war and secure a DEKRA-inspected vehicle at the **bank's outstanding balance**, not retail price. Free delivery, a 1.5-hour test drive, and a **100% refund** if you're not happy.\n\nWhat kind of vehicle are you after? Let's find you a deal. 🚗");
  }, 400);
});
</script>
</body>
</html>
