; AHG — PHP-FPM / CGI upload limits (read by PHP directly, not Apache)
; Allows career video uploads up to 100 MB.
upload_max_filesize = 110M
post_max_size       = 115M
max_execution_time  = 300
max_input_time      = 300
memory_limit        = 256M

; Never show PHP errors to visitors (they leak server paths); log them instead.
; cPanel → Errors / public_html/error_log shows them.
display_errors = Off
display_startup_errors = Off
log_errors = On
