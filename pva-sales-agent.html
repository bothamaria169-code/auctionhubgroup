<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --blue:        #005BA1;
  --blue-dark:   #004a8a;
  --blue-deep:   #003a70;
  --blue-mid:    #c3ddf5;
  --blue-light:  #e8f3fc;
  --cyan:        #00AEEF;
  --cyan-dark:   #0090c5;
  --white:       #ffffff;
  --off-white:   #f4f7fb;
  --gray-100:    #f0f4f8;
  --gray-200:    #e0e8f0;
  --border:      #dae4ed;
  --text:        #0d1e2e;
  --text-body:   #2c3e50;
  --text-muted:  #6c8a9f;
  --success:     #1a9e4e;
  --warning:     #e07b00;
  --danger:      #c0392b;
  --wa-green:    #25D366;
  --radius:      8px;
}

html, body {
  height: 100%;
  font-family: 'DM Sans', sans-serif;
  background: var(--off-white);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}

/* ═══ SHELL ═══ */
.shell {
  width: 100%;
  max-width: 480px;
  height: 100vh;
  max-height: 840px;
  display: flex;
  flex-direction: column;
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid var(--border);
  box-shadow: 0 8px 48px rgba(0, 91, 161, 0.16);
  background: var(--white);
  margin: 0 auto;
  position: relative;
}

/* Fill height when inside an iframe widget */
body.in-widget {
  background: transparent;
}
body.in-widget .shell {
  max-width: 100%;
  height: 100%;
  max-height: 100%;
  border-radius: 0;
  border: none;
  box-shadow: none;
}

/* ═══ HEADER ═══ */
.hdr {
  background: linear-gradient(135deg, var(--blue) 0%, var(--blue-deep) 100%);
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  border-bottom: 2px solid var(--cyan);
}
.hdr-logo {
  width: 36px; height: 36px;
  border-radius: 6px;
  overflow: hidden;
  flex-shrink: 0;
  background: white;
  display: flex; align-items: center; justify-content: center;
}
.hdr-logo img { width: 100%; height: 100%; object-fit: contain; }
.hdr-logo-fb { font-size: 11px; font-weight: 800; color: var(--blue); }
.hdr-info { flex: 1; min-width: 0; }
.hdr-name {
  font-size: 13px; font-weight: 700;
  color: white; letter-spacing: 0.4px; line-height: 1.2;
}
.hdr-sub { font-size: 9.5px; color: rgba(255,255,255,0.72); margin-top: 1px; }
.hdr-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.status-pill {
  display: flex; align-items: center; gap: 4px;
  background: rgba(255,255,255,0.14);
  border: 1px solid rgba(255,255,255,0.28);
  border-radius: 20px; padding: 3px 8px;
  font-size: 9px; color: white; white-space: nowrap;
}
.s-dot {
  width: 6px; height: 6px; background: #4ade80;
  border-radius: 50%; animation: blink 2s ease infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.4} }
.lang-sel {
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.24);
  border-radius: 4px; padding: 4px 6px;
  color: white; font-size: 11px;
  cursor: pointer; outline: none;
  font-family: 'DM Sans', sans-serif;
}
.lang-sel option { color: var(--text); background: white; }

/* ═══ AGENT ROW ═══ */
.agents-row {
  background: var(--blue-light);
  border-bottom: 1px solid var(--border);
  padding: 6px 12px; display: flex;
  gap: 5px; overflow-x: auto; scrollbar-width: none; flex-shrink: 0;
}
.agents-row::-webkit-scrollbar { display: none; }
.a-chip {
  background: white; border: 1px solid var(--border);
  border-radius: 20px; padding: 4px 11px;
  font-size: 10px; white-space: nowrap;
  color: var(--text-body);
  display: flex; align-items: center; gap: 5px;
  cursor: pointer; flex-shrink: 0;
  text-decoration: none; transition: 0.12s;
  font-family: 'DM Sans', sans-serif;
}
.a-chip:hover { background: var(--blue); color: white; border-color: var(--blue); }
.a-chip .wa-i { color: var(--wa-green); font-size: 11px; transition: 0.12s; }
.a-chip:hover .wa-i { color: white; }
.a-chip .live-dot { width: 6px; height: 6px; background: #4ade80; border-radius: 50%; }

/* ═══ TABS ═══ */
.tabs {
  display: flex; border-bottom: 2px solid var(--border);
  background: white; flex-shrink: 0;
}
.tab-btn {
  flex: 1; padding: 9px 12px;
  font-size: 12px; font-weight: 600;
  border: none; background: none;
  color: var(--text-muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  transition: 0.15s;
  font-family: 'DM Sans', sans-serif;
  display: flex; align-items: center; justify-content: center; gap: 5px;
}
.tab-btn.active { color: var(--blue); border-bottom-color: var(--blue); }
.tab-btn:hover:not(.active) { background: var(--gray-100); color: var(--text-body); }
.tab-badge {
  background: var(--cyan); color: white;
  font-size: 8px; font-weight: 700;
  padding: 1px 5px; border-radius: 10px;
  min-width: 16px; text-align: center;
}

/* ═══ PANEL CONTAINER ═══ */
.panel { display: none; flex-direction: column; flex: 1; overflow: hidden; }
.panel.active { display: flex; }

/* ═══ CHAT PANEL ═══ */
.messages {
  flex: 1; overflow-y: auto;
  padding: 14px 12px 6px;
  display: flex; flex-direction: column; gap: 10px;
  scroll-behavior: smooth;
}
.messages::-webkit-scrollbar { width: 3px; }
.messages::-webkit-scrollbar-thumb { background: var(--gray-200); border-radius: 2px; }

.msg { display: flex; gap: 8px; max-width: 90%; animation: slideUp 0.18s ease; }
.msg.user { align-self: flex-end; flex-direction: row-reverse; }
.msg.agent { align-self: flex-start; }

.av {
  width: 28px; height: 28px; border-radius: 50%;
  font-size: 9px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-top: 2px;
}
.msg.agent .av { background: var(--blue); color: white; }
.msg.user  .av { background: var(--gray-200); color: var(--text-muted); }

.bubble {
  padding: 9px 13px; font-size: 13px; line-height: 1.56; border-radius: 14px;
}
.msg.agent .bubble {
  background: var(--blue-light);
  border: 1px solid var(--blue-mid);
  border-bottom-left-radius: 2px;
  color: var(--text);
}
.msg.user .bubble {
  background: var(--blue);
  color: white;
  border-bottom-right-radius: 2px;
}
.msg.agent .bubble b,
.msg.agent .bubble strong { color: var(--blue-dark); }
.bubble a { color: inherit; text-decoration: underline; }
.bubble .ph-tag {
  display: inline-block; background: rgba(0,91,161,0.1);
  border: 1px solid rgba(0,91,161,0.22);
  border-radius: 4px; padding: 1px 6px;
  font-family: 'DM Mono', monospace; font-size: 11px; color: var(--blue);
}
.bubble.err { background: #fdecea; border-color: #f4a4a4; color: #c62828; }

/* Typing */
.typing-wrap { display: flex; gap: 8px; align-self: flex-start; }
.typing-bub {
  padding: 10px 14px;
  background: var(--blue-light); border: 1px solid var(--blue-mid);
  border-radius: 14px; border-bottom-left-radius: 2px;
  display: flex; gap: 4px; align-items: center;
}
.t-dot {
  width: 5px; height: 5px; background: var(--blue);
  border-radius: 50%; animation: tdot 1.2s infinite;
}
.t-dot:nth-child(2) { animation-delay: .2s; }
.t-dot:nth-child(3) { animation-delay: .4s; }
@keyframes tdot { 0%,60%,100%{transform:translateY(0);opacity:.4} 30%{transform:translateY(-5px);opacity:1} }
@keyframes slideUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

/* WhatsApp CTA strip */
.wa-strip {
  padding: 7px 12px;
  border-top: 1px solid var(--border);
  background: var(--gray-100);
  display: flex; gap: 5px; flex-shrink: 0; flex-wrap: wrap;
}
.wa-btn {
  flex: 1; min-width: 110px;
  background: var(--wa-green);
  border: none; border-radius: 6px;
  color: white; font-size: 11px; font-weight: 600;
  padding: 7px 10px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 5px;
  text-decoration: none; font-family: 'DM Sans', sans-serif;
  transition: 0.12s;
}
.wa-btn:hover { background: #1ebe5c; }
.wa-btn.blue-btn { background: var(--blue); }
.wa-btn.blue-btn:hover { background: var(--blue-dark); }

/* Quick replies */
.qr-row {
  padding: 6px 12px; display: flex; flex-wrap: wrap; gap: 5px;
  border-top: 1px solid var(--border); background: white; flex-shrink: 0;
}
.qr {
  background: white; border: 1px solid var(--blue-mid);
  color: var(--blue); font-size: 10.5px; padding: 5px 11px;
  border-radius: 20px; cursor: pointer; transition: 0.1s;
  font-family: 'DM Sans', sans-serif;
}
.qr:hover { background: var(--blue); color: white; border-color: var(--blue); }

/* Input */
.input-row {
  background: white; border-top: 1px solid var(--border);
  padding: 10px 12px; display: flex; gap: 6px;
  align-items: flex-end; flex-shrink: 0;
}
textarea {
  flex: 1; background: var(--gray-100);
  border: 1.5px solid var(--border); border-radius: 20px;
  color: var(--text); font-family: 'DM Sans', sans-serif;
  font-size: 13px; padding: 9px 14px;
  resize: none; min-height: 40px; max-height: 90px; line-height: 1.4;
  transition: border-color 0.15s;
}
textarea::placeholder { color: var(--text-muted); }
textarea:focus { outline: none; border-color: var(--blue); background: white; }
.send-btn {
  width: 40px; height: 40px;
  background: var(--blue); border: none; border-radius: 50%;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: 0.15s; color: white; font-size: 15px;
}
.send-btn:hover { background: var(--blue-dark); }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ═══ BROWSE PANEL ═══ */
.browse-wrap { display: flex; flex-direction: column; flex: 1; overflow: hidden; }

.browse-search-bar {
  padding: 10px 12px; border-bottom: 1px solid var(--border);
  background: white; display: flex; gap: 6px; flex-shrink: 0;
}
.browse-search-bar input {
  flex: 1; background: var(--gray-100);
  border: 1.5px solid var(--border); border-radius: 20px;
  padding: 8px 14px; font-size: 13px;
  font-family: 'DM Sans', sans-serif; color: var(--text);
  outline: none; transition: border-color 0.15s;
}
.browse-search-bar input:focus { border-color: var(--blue); background: white; }
.search-go {
  width: 36px; height: 36px; background: var(--blue);
  border: none; border-radius: 50%; color: white;
  font-size: 13px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  transition: 0.12s;
}
.search-go:hover { background: var(--blue-dark); }

.browse-meta {
  padding: 5px 14px; font-size: 11px; color: var(--text-muted);
  background: var(--blue-light); border-bottom: 1px solid var(--border); flex-shrink: 0;
}

.v-grid {
  flex: 1; overflow-y: auto;
  padding: 10px; display: grid;
  grid-template-columns: 1fr 1fr; gap: 8px; align-content: start;
}
.v-grid::-webkit-scrollbar { width: 3px; }
.v-grid::-webkit-scrollbar-thumb { background: var(--gray-200); border-radius: 2px; }

/* Vehicle card */
.v-card {
  background: white; border: 1.5px solid var(--border);
  border-radius: 10px; overflow: hidden;
  cursor: pointer; transition: 0.15s; display: flex; flex-direction: column;
}
.v-card:hover {
  border-color: var(--blue);
  box-shadow: 0 4px 16px rgba(0,91,161,0.13);
  transform: translateY(-2px);
}
.v-thumb {
  width: 100%; aspect-ratio: 16/9;
  background: var(--blue-light);
  display: flex; align-items: center; justify-content: center; overflow: hidden;
  position: relative;
}
.v-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.v-thumb-icon { color: var(--blue-mid); font-size: 30px; }
.v-status-tag {
  position: absolute; top: 5px; left: 5px;
  font-size: 7.5px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .5px;
  padding: 2px 6px; border-radius: 4px;
}
.st-active   { background: #e8f7ef; color: var(--success); }
.st-upcoming { background: #e0f5fd; color: #0284c7; }

.v-body { padding: 8px 9px; flex: 1; display: flex; flex-direction: column; }
.v-make { font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; }
.v-name { font-size: 11.5px; font-weight: 700; color: var(--text); line-height: 1.2; margin: 2px 0 3px; }
.v-meta { font-size: 9.5px; color: var(--text-muted); }
.v-price { font-size: 13px; font-weight: 700; color: var(--blue); margin-top: 5px; }
.v-grade {
  display: inline-block; margin-top: 3px;
  font-size: 8.5px; font-weight: 600;
  padding: 1px 6px; border-radius: 4px;
}
.gr-A, .gr-Platinum { background: #e8f7ef; color: var(--success); }
.gr-B, .gr-Gold     { background: #fff8e1; color: #b8860b; }
.gr-C, .gr-Green    { background: #f0fdf4; color: #2e7d32; }
.gr-D               { background: #fdecea; color: var(--danger); }

/* Grid states */
.grid-loading, .grid-empty {
  grid-column: 1 / -1; display: flex;
  flex-direction: column; align-items: center;
  justify-content: center; padding: 40px 20px; gap: 12px;
}
.spinner {
  width: 32px; height: 32px;
  border: 3px solid var(--blue-mid);
  border-top-color: var(--blue);
  border-radius: 50%; animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.empty-icon { font-size: 40px; color: var(--blue-mid); }
.empty-title { font-size: 13px; font-weight: 600; color: var(--text-muted); }
.empty-sub   { font-size: 11px; color: var(--text-muted); text-align: center; }

/* Pagination */
.v-pagination {
  padding: 8px 12px; border-top: 1px solid var(--border);
  display: flex; gap: 6px; align-items: center; justify-content: center;
  background: white; flex-shrink: 0;
}
.pg-btn {
  width: 30px; height: 30px;
  border: 1px solid var(--border); border-radius: 6px;
  background: white; color: var(--text-muted); font-size: 12px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: 0.12s; font-family: 'DM Sans', sans-serif;
}
.pg-btn:hover:not(:disabled) { background: var(--blue); color: white; border-color: var(--blue); }
.pg-btn:disabled { opacity: .3; cursor: not-allowed; }
.pg-info { font-size: 11px; color: var(--text-muted); margin: 0 4px; }

/* ═══ FOOTER BAR ═══ */
.foot-bar {
  background: var(--blue-deep);
  border-top: 2px solid var(--cyan);
  text-align: center; padding: 5px 10px;
  font-size: 8.5px; color: rgba(255,255,255,0.6); flex-shrink: 0;
}
.foot-bar a { color: rgba(255,255,255,0.75); text-decoration: none; }

/* Responsive: single column on very narrow (widget mode) */
@media (max-width: 320px) {
  .v-grid { grid-template-columns: 1fr; }
}
</style>
</head>

const WA_GEORGE = 'https://wa.me/27692670353';

const QUICK_REPLIES = {
  English:   ['🚗 Show latest stock','💰 Pre-Auction savings','🔑 Finance (bad credit OK)','✅ How to register','📋 Test drive info'],
  Afrikaans: ['🚗 Nuutste voorraad','💰 Voorveiling-deals','🔑 Finansiering','✅ Registrasie','📋 Toetsrit'],
  isiZulu:   ['🚗 Izimoto zakamuva','💰 Amanani e-Pre-Auction','🔑 Uxhaso','✅ Ukubhalisa','📋 Uhambo lovivinyo'],
  isiXhosa:  ['🚗 Izithuthi zanamhlanje','💰 Amanani e-Pre-Auction','🔑 Uxhaso lwezimali','✅ Ukubhalisa','📋 Uvavanyo'],
  Sesotho:   ['🚗 Dikoloi tse ntjha','💰 Pre-Auction','🔑 Finance','✅ Ngodisa','📋 Teko ya ho khanna'],
  Setswana:  ['🚗 Dikoloi tse ntjha','💰 Pre-Auction','🔑 Finance','✅ Ingodise','📋 Toetso ya go tshola'],
};

let lang        = 'English';
let chatHistory = [];
let busy        = false;
let browseInit  = false;
let curPage     = 1;
let totalPages  = 1;

/* ── TABS ── */
function switchTab(tab) {
  ['chat','browse'].forEach(t => {
    document.getElementById('panel' + t.charAt(0).toUpperCase() + t.slice(1))
             .classList.toggle('active', t === tab);
    document.getElementById('tab'   + t.charAt(0).toUpperCase() + t.slice(1))
             .classList.toggle('active', t === tab);
  });
  if (tab === 'browse' && !browseInit) { browseInit = true; loadVehicles(1); }
}

/* ── VEHICLE BROWSE ── */
async function loadVehicles(page) {
  curPage = page;
  const q    = document.getElementById('srchInput').value.trim();
  const grid = document.getElementById('vGrid');
  const meta = document.getElementById('browseMeta');

  grid.innerHTML = '<div class="grid-loading"><div class="spinner"></div><span style="font-size:12px;color:var(--text-muted)">Fetching live stock…</span></div>';
  meta.textContent = 'Searching…';

  try {
    const r = await fetch(`${V_API}?q=${encodeURIComponent(q)}&page=${page}`);
    const d = await r.json();
    totalPages = d.pages || 1;

    if (!d.vehicles || !d.vehicles.length) {
      grid.innerHTML = `<div class="grid-empty">
        <div class="empty-icon"><i class="fas fa-car-side"></i></div>
        <div class="empty-title">${q ? 'No matches found' : 'No live stock right now'}</div>
        <div class="empty-sub">${q ? 'Try a different make or year' : 'New vehicles are added regularly — check back soon!'}</div>
      </div>`;
      meta.textContent = q ? `No results for "${q}"` : 'No vehicles currently listed';
      document.getElementById('vPager').innerHTML = '';
      document.getElementById('stockBadge').textContent = '0';
      return;
    }

    meta.textContent = `${d.total.toLocaleString()} vehicle${d.total !== 1 ? 's' : ''} available · Page ${page} of ${totalPages}`;
    document.getElementById('stockBadge').textContent = d.total > 99 ? '99+' : d.total;

    grid.innerHTML = d.vehicles.map(v => {
      const price      = Number(v.current_price > 0 ? v.current_price : v.start_price);
      const km         = Number(v.mileage || 0).toLocaleString();
      const gradeKey   = (v.condition_grade || '').replace(/\s/g, '') || 'D';
      const statusCls  = v.status === 'active' ? 'st-active' : 'st-upcoming';
      const statusLbl  = v.status === 'active' ? 'Active' : 'Upcoming';
      const imgHtml    = v.image_url
        ? `<img src="${escHtml(v.image_url)}" alt="${escHtml(v.make + ' ' + v.item_name)}" loading="lazy"
                onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
        : '';
      const iconDisp   = v.image_url ? 'style="display:none"' : '';
      return `
        <div class="v-card" onclick="vehicleEnquiry('${escJs(v.make)}','${escJs(v.item_name)}',${v.year})">
          <div class="v-thumb">
            ${imgHtml}
            <i class="fas fa-car v-thumb-icon" ${iconDisp}></i>
            <span class="v-status-tag ${statusCls}">${statusLbl}</span>
          </div>
          <div class="v-body">
            <div class="v-make">${escHtml(v.make)}</div>
            <div class="v-name">${escHtml(v.item_name)} ${v.year || ''}</div>
            <div class="v-meta">${km}km · ${escHtml(v.fuel_type||'')} · ${escHtml(v.transmission||'')}</div>
            <div class="v-price">R${price.toLocaleString()}</div>
            ${v.condition_grade ? `<span class="v-grade gr-${escHtml(gradeKey)}">DEKRA: ${escHtml(v.condition_grade)}</span>` : ''}
          </div>
        </div>`;
    }).join('');

    renderPager(page, totalPages);

  } catch(err) {
    grid.innerHTML = `<div class="grid-empty">
      <div class="empty-icon"><i class="fas fa-wifi"></i></div>
      <div class="empty-title">Connection error</div>
      <div class="empty-sub">Could not load vehicles. Please try again.</div>
    </div>`;
    meta.textContent = 'Error loading vehicles';
  }
}

function renderPager(page, total) {
  const pg = document.getElementById('vPager');
  if (total <= 1) { pg.innerHTML = ''; return; }
  pg.innerHTML = `
    <button class="pg-btn" onclick="loadVehicles(${page-1})" ${page<=1?'disabled':''} aria-label="Previous page">
      <i class="fas fa-chevron-left"></i>
    </button>
    <span class="pg-info">${page} / ${total}</span>
    <button class="pg-btn" onclick="loadVehicles(${page+1})" ${page>=total?'disabled':''} aria-label="Next page">
      <i class="fas fa-chevron-right"></i>
    </button>`;
}

function vehicleEnquiry(make, model, year) {
  switchTab('chat');
  sendChat(`Tell me more about the ${make} ${model} ${year} — I want pre-auction pricing and availability.`);
}

/* ── CHAT ── */
function addMsg(role, html, isErr) {
  const msgs = document.getElementById('msgs');
  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;
  const av = document.createElement('div');
  av.className = 'av';
  av.textContent = role === 'agent' ? 'PVA' : 'YOU';
  const bub = document.createElement('div');
  bub.className = 'bubble' + (isErr ? ' err' : '');
  bub.innerHTML = renderMarkdown(html);
  wrap.appendChild(av);
  wrap.appendChild(bub);
  msgs.appendChild(wrap);
  msgs.scrollTop = msgs.scrollHeight;
}

function renderMarkdown(t) {
  return t
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g,     '<em>$1</em>')
    .replace(/(\+27[\d\s\-]+)/g, '<span class="ph-tag">$1</span>')
    .replace(/\n/g, '<br>');
}

let typingEl = null;
function showTyping() {
  if (typingEl) return;
  const msgs = document.getElementById('msgs');
  typingEl = document.createElement('div');
  typingEl.className = 'typing-wrap';
  typingEl.innerHTML = `
    <div class="av" style="background:var(--blue);color:white;">PVA</div>
    <div class="typing-bub">
      <div class="t-dot"></div><div class="t-dot"></div><div class="t-dot"></div>
    </div>`;
  msgs.appendChild(typingEl);
  msgs.scrollTop = msgs.scrollHeight;
}
function hideTyping() { if (typingEl) { typingEl.remove(); typingEl = null; } }

function buildQR() {
  const row = document.getElementById('qrRow');
  row.innerHTML = '';
  (QUICK_REPLIES[lang] || QUICK_REPLIES.English).forEach(txt => {
    const b = document.createElement('button');
    b.className = 'qr';
    b.textContent = txt;
    b.onclick = () => sendChat(txt);
    row.appendChild(b);
  });
}

async function sendChat(text) {
  const txt   = text || document.getElementById('txt').value.trim();
  if (!txt || busy) return;
  document.getElementById('txt').value = '';
  autoH();
  busy = true;
  document.getElementById('sendBtn').disabled = true;
  addMsg('user', txt);
  showTyping();
  switchTab('chat');

  try {
    const r = await fetch(PROXY, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: txt, history: chatHistory, lang }),
    });
    const d = await r.json();
    hideTyping();
    const reply = d.reply || 'Sharp, small hiccup on my end! Call **+27 10 516 0681** directly.';
    addMsg('agent', reply);
    chatHistory.push({ role: 'user',      content: txt   });
    chatHistory.push({ role: 'assistant', content: reply });
    if (chatHistory.length > 20) chatHistory = chatHistory.slice(-20);

    if (d.total_vehicles) {
      document.getElementById('stockBadge').textContent =
        d.total_vehicles > 99 ? '99+' : d.total_vehicles;
    }
  } catch (_) {
    hideTyping();
    addMsg('agent',
      'Network issue — no stress! WhatsApp **Brian on +27 83 670 9292** or call **+27 10 516 0681**. We\'re standing by! 🤙',
      true);
  }

  busy = false;
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('txt').focus();
}

function autoH() {
  const t = document.getElementById('txt');
  t.style.height = 'auto';
  t.style.height = Math.min(t.scrollHeight, 90) + 'px';
}

/* ── HELPERS ── */
function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escJs(s) {
  return String(s).replace(/'/g,"\\'").replace(/\\/g,'\\\\');
}

/* ── INIT ── */
(function init() {
  buildQR();

  document.getElementById('txt').addEventListener('input', autoH);
  document.getElementById('txt').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
  });
  document.getElementById('sendBtn').onclick = () => sendChat();
  document.getElementById('srchInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') loadVehicles(1);
  });
  document.getElementById('langSel').addEventListener('change', e => {
    lang = e.target.value;
    buildQR();
    addMsg('agent', `🌍 Switched to **${lang}**. How can I help you find your next vehicle?`);
  });

  /* Detect iframe / widget mode */
  if (window.self !== window.top) {
    document.body.classList.add('in-widget');
  }

  /* Welcome message */
  setTimeout(() => addMsg('agent',
    `👋 **Howzit! Welcome to Auction Hub Group.**\n\nI'm NOVA, your online support agent. We sell genuine **ABSA bank-repossessed vehicles** — you pay the bank's outstanding balance, not retail price. That means up to **R60,000 in savings** on every vehicle.\n\n🚗 Browse live stock in the **Browse Vehicles** tab, or ask me anything below!`
  ), 350);
})();
</script>
